apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pagedserve
resources:
  - namespace.yaml
  - models-pvc.yaml
  - engine.yaml
  - router.yaml
# Point these at your registry and tag when you push the images.
images:
  - name: pagedserve-engine
    newName: pagedserve-engine
    newTag: 0.1.0
  - name: pagedserve-router
    newName: pagedserve-router
    newTag: 0.1.0
