[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pagedserve"
version = "0.0.1"
description = "A small LLM inference engine (paged KV cache, continuous batching, prefix caching) and a prefix-aware router."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "httpx",
    "numpy",
    "safetensors",
    "torch",
    "uvicorn",
]

[project.optional-dependencies]
# Reference implementations used only by tests and benchmarks (never by the engine itself).
dev = [
    "matplotlib",
    "transformers",
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["engine*", "router*", "bench*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["engine", "router", "bench"]
# torch and transformers ship their own types; keep third-party noise out of our results.
ignore_missing_imports = true

# A Triton kernel is a function with untyped tensor-pointer parameters and a decorator that
# is untyped when Triton is not installed (as on the CPU-only laptop); everything else stays strict.
[[tool.mypy.overrides]]
module = "engine.triton_paged_attention"
disallow_untyped_decorators = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: needs a CUDA GPU; run by hand on the GPU box (deselected in CI)",
    "real_model: needs the real Llama weights in models/ (skipped when absent)",
]
