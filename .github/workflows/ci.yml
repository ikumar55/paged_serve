name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU-only PyTorch
        run: python -m pip install -c constraints.txt torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and dev tools
        run: python -m pip install -c constraints.txt -e '.[dev]'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests (CPU only)
        run: pytest -m "not gpu"
