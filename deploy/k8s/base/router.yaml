# The router: one Deployment (it keeps no state worth replicating yet) and a Service in front of it.
# It sends each request to one of the engine replicas, by prompt prefix with the precise-prefix
# policy (router/policies.py). The replica list is fixed by the StatefulSet's pod names, so if you
# change `replicas` in engine.yaml, change the --replica arguments here (a test checks they agree).
#
# STATUS: written 2026-11-24 without a cluster; validated offline only; NEVER APPLIED.
# The --load-cap value is a starting point, not a tuned one: D-007 found that it decides whether
# prefix routing happens at all, and D-022 (router on real replicas) has not been run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  labels:
    app.kubernetes.io/name: router
    app.kubernetes.io/part-of: pagedserve
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: router
        app.kubernetes.io/part-of: pagedserve
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: router
          image: pagedserve-router
          imagePullPolicy: IfNotPresent
          args:
            - "--replica"
            - "http://engine-0.engine:8000"
            - "--replica"
            - "http://engine-1.engine:8000"
            - "--policy"
            - "precise-prefix"
            - "--load-cap"
            - "48"
            - "--poll-interval"
            - "0.5"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "9000"
          ports:
            - name: http
              containerPort: 9000
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # /health is 503 until at least one engine replica is healthy, so the Service only sends
          # traffic here once there is somewhere to route it.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6 # tolerate the engines starting slowly
---
apiVersion: v1
kind: Service
metadata:
  name: router
  labels:
    app.kubernetes.io/name: router
    app.kubernetes.io/part-of: pagedserve
spec:
  type: ClusterIP # reach it from outside with `kubectl port-forward svc/router 9000:80`
  selector:
    app.kubernetes.io/name: router
  ports:
    - name: http
      port: 80
      targetPort: http
